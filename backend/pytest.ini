[pytest]
testpaths = tests
# convenção do projeto: <classe>Test.py (unitário, uma classe de teste por classe de produção)
# e <api>Tests.py (integração, usando as classes <api>Activity)
python_files = *Test.py *Tests.py
python_classes = *Test *Tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
